# Standalone HTTP config for Xbox 302 + LuCI proxy. Not using UCI server blocks
# so leftover _lan/:443 and _redirect2ssl cannot steal ports from uhttpd.
worker_processes auto;
user root;

events {}

http {
	access_log off;
	log_format openwrt
		'$request_method $scheme://$host$request_uri => $status'
		' (${body_bytes_sent}B in ${request_time}s) <- $http_referer';

	include mime.types;
	default_type application/octet-stream;
	sendfile on;

	client_max_body_size 128M;
	large_client_header_buffers 4 512k;

	gzip on;
	gzip_vary on;
	gzip_proxied any;
	gzip_types *;

	root /www;

	include conf.d/*.conf;
}
