# 编译选项默认值。手动触发 Actions 时页面上已预填同样的建议值，改了以页面为准；
# 定时编译和 push 触发的编译直接用这里的值。
# 不要在这里写后台密码或 PPPoE 账号密码：固件发布在公开的 Release 里。

# 后台地址（LAN IP）
LAN_IP=192.168.1.1
# 主机名
HOSTNAME=Ryan-OpenWrt
# Web 服务器：uhttpd 或 nginx
WEB_SERVER=uhttpd
# WAN 口：eth0 / eth1 / ... ，填 auto 则用 Kwrt 默认（>2 网卡时 eth1 当 WAN）
WAN_PORT=eth0
# LAN 口：auto = 除 WAN 口以外的所有 eth 口（默认）；也可列出口名，空格分隔，如 "eth1 eth2"
LAN_PORTS=auto
# WAN 拨号方式：keep（升级保留现有设置）/ pppoe / dhcp
WAN_PROTO=keep
# 根文件系统：ext4（与现机一致）或 squashfs
FILESYSTEM=ext4
# 是否支持 IPv6：off 或 on
IPV6=on
# 科学上网客户端：passwall / passwall2 / openclash / homeproxy / ssr-plus / none
# passwall 会连同 smartdns 和现机依赖一起编进固件
INTERNET=passwall
# 自定义版本签名，替换 “by Kiddin'”。留空则去掉作者签名
SIGNATURE=
# 去除作者外链（yes/no）。软件源 dl.openwrt.ai 会保留
REMOVE_AUTHOR_LINKS=yes
# 额外软件包（空格分隔），会追加到 packages.txt 之后
EXTRA_PACKAGES=""
