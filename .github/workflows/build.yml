name: Build x86_64 firmware

on:
  workflow_dispatch:
    # 手动触发时在页面上选；留空用 build.conf 里的默认值
    # 手动触发时页面上已预填建议值，可直接改；定时/push 编译用 build.conf
    inputs:
      lan_ip:
        description: "后台地址 LAN IP"
        required: true
        default: "192.168.1.1"
      web_server:
        description: "Web 服务器（建议 uhttpd）"
        type: choice
        options: [uhttpd, nginx]
        default: uhttpd
      wan_port:
        description: "WAN 口（建议 eth0；auto=交给 Kwrt 分配，不建议）"
        type: choice
        options: [eth0, eth1, eth2, eth3, auto]
        default: eth0
      lan_ports:
        description: "LAN 口：auto=除 WAN 外所有口（建议）；或列口名，空格分隔，如 eth1 eth2"
        required: true
        default: "auto"
      wan_proto:
        description: "WAN 拨号（建议 keep=升级保留现有设置；账号密码不进固件）"
        type: choice
        options: [keep, pppoe, dhcp]
        default: keep
      extra_packages:
        description: "额外软件包，空格分隔，可留空（私有包别填这里）"
        required: false
        default: ""
  schedule:
    # 每月 1 号 08:00 CST（00:00 UTC）
    - cron: "0 0 1 * *"
  push:
    branches: [main, master]
    paths:
      - "packages.txt"
      - "extra.config"
      - "build.conf"
      - "files/**"
      - "scripts/**"
      - ".github/workflows/build.yml"

concurrency:
  group: build-x86_64
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      TZ: Asia/Shanghai
      TARGET: x86_64

    steps:
      - name: Checkout overlay
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Install build deps
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget dwarves \
            llvm python3-pyelftools libpython3-dev aria2 jq qemu-utils ccache \
            libelf-dev device-tree-compiler libgmp3-dev libmpc-dev libfuse-dev rename
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          sudo timedatectl set-timezone "$TZ"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Prepare OpenWrt tree
        env:
          IN_LAN_IP: ${{ inputs.lan_ip }}
          IN_WEB_SERVER: ${{ inputs.web_server }}
          IN_WAN_PORT: ${{ inputs.wan_port }}
          IN_LAN_PORTS: ${{ inputs.lan_ports }}
          IN_WAN_PROTO: ${{ inputs.wan_proto }}
          IN_EXTRA_PACKAGES: ${{ inputs.extra_packages }}
        run: |
          chmod +x scripts/prepare.sh
          ./scripts/prepare.sh

      - name: Move build dirs to extra disk
        run: |
          sudo mkdir -p -m 777 /mnt/openwrt/build_dir
          rm -rf openwrt/build_dir
          ln -s /mnt/openwrt/build_dir openwrt/build_dir

      - name: Cache toolchain
        uses: actions/cache@v4
        with:
          path: |
            openwrt/staging_dir/host
            openwrt/staging_dir/hostpkg
            openwrt/staging_dir/toolchain-*
            openwrt/build_dir/host
            openwrt/build_dir/hostpkg
          key: x86_64-toolchain-${{ hashFiles('packages.txt', 'extra.config') }}
          restore-keys: |
            x86_64-toolchain-

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: openwrt/.ccache
          key: x86_64-ccache-${{ github.run_id }}
          restore-keys: |
            x86_64-ccache-

      - name: Download sources
        run: |
          cd openwrt
          make download -j8 || make download -j1 V=s
          find dl -size -1024c -exec rm -f {} \; || true

      - name: Compile
        id: compile
        run: |
          df -hT
          cd openwrt
          ccache -M 3G -d .ccache >/dev/null 2>&1 || true
          make -j$(($(nproc)+1)) || {
            log=$(mktemp)
            make -j1 V=s >"$log" 2>&1 || true
            tail -n 80 "$log"
            exit 1
          }
          ccache -s -d .ccache || true
          df -hT

      - name: Collect artifacts
        run: |
          mkdir -p out
          shopt -s nullglob
          cp openwrt/bin/targets/x86/64/*ext4-combined-efi.img.gz out/ || true
          cp openwrt/bin/targets/x86/64/sha256sums out/ || true
          cp openwrt/.config out/config.build || true
          cp openwrt/files/etc/ryan-build.conf out/ryan-build.conf || true
          {
            echo "BUILD_OPTS<<EOF"
            sed 's/^/- /' openwrt/files/etc/ryan-build.conf
            echo "EOF"
          } >> "$GITHUB_ENV"
          ls -lh out
          test -n "$(ls -A out/*ext4-combined-efi.img.gz 2>/dev/null)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ryan-openwrt-x86_64
          path: out/
          if-no-files-found: error
          retention-days: 14

      - name: Stamp version
        run: echo "STAMP=$(TZ=Asia/Shanghai date +%Y.%m.%d)-${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.STAMP }}-x86_64
          name: Ryan-OpenWrt ${{ env.STAMP }} x86_64
          files: out/*
          body: |
            基于 kiddin9/Kwrt `25.12` + OpenWrt `openwrt-25.12`。
            刷机文件：`*-ext4-combined-efi.img.gz`（EFI + ext4）。

            编译选项：
            ${{ env.BUILD_OPTS }}

            - SSH: 端口见现机配置，公网由防火墙挡住
            - 包清单：`packages.txt`
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
