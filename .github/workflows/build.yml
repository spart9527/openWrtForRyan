name: Build x86_64 firmware

on:
  workflow_dispatch:
    # 手动触发时在页面上选；留空用 build.conf 里的默认值
    # 手动触发时页面上已预填建议值，可直接改；定时/push 编译用 build.conf
    inputs:
      lan_ip:
        description: "后台地址，也就是 LAN 口 IP。刷机后会按这个值写入，并覆盖你在后台改过的 LAN IP。默认 192.168.1.1。"
        required: true
        default: "192.168.1.1"
      hostname:
        description: "路由器主机名，显示在后台和终端提示符里。刷机后会按这个值写入，并覆盖你在后台改过的主机名。默认 Ryan-OpenWrt。"
        required: true
        default: "Ryan-OpenWrt"
      web_server:
        description: "LuCI 后台用的 Web 服务器。uhttpd 是 OpenWrt 传统方案，访问 http://后台地址/ 即可登录（推荐）。nginx 是 Kwrt 默认，但根路径可能出现 403。"
        type: choice
        options: [uhttpd, nginx]
        default: uhttpd
      wan_port:
        description: "WAN 口（接光猫/上网的那张网卡）。建议 eth0，与现机一致。选 auto 则交给 Kwrt 分配；机器有 3 个及以上网口时 Kwrt 会把 eth1 当 WAN，不建议。"
        type: choice
        options: [eth0, eth1, eth2, eth3, auto]
        default: eth0
      lan_ports:
        description: "LAN 口。填 auto 表示除 WAN 外的所有 eth 口（推荐）；也可指定口名，空格分隔，如 eth1 eth2。指定的口在这台机器上不存在时，开机脚本不会改网口，以免断网。"
        required: true
        default: "auto"
      wan_proto:
        description: "WAN 拨号方式。keep=升级时保留现有设置（推荐）；pppoe=只改成 PPPoE 协议，账号密码沿用现机，全新刷机后需在后台填写；dhcp=自动获取 IP。账号密码不会写入固件。"
        type: choice
        options: [keep, pppoe, dhcp]
        default: keep
      filesystem:
        description: "根文件系统。ext4=根分区可直接读写，与现机一致（推荐）。squashfs=系统文件只读，改动在 overlay 里，误删的出厂文件可从 /rom 恢复，但不能回滚到上一版固件。从一种格式换到另一种会整盘重写分区，不能当普通升级。"
        type: choice
        options: [ext4, squashfs]
        default: ext4
      ipv6:
        description: "是否启用 IPv6。默认 on：保留 OpenWrt 默认的 IPv6 能力，刷机不改现有 wan6 等配置（不想用 IPv6，在路由器上关掉 wan6 即可）。off：不装 IPv6 拨号和隧道组件，并在每次刷机后清除 wan6、LAN IPv6 和 DHCPv6 配置（内核仍保留 IPv6，firewall4 需要它）。"
        type: choice
        options: ["on", "off"]
        default: "on"
      internet:
        description: "科学上网客户端，直接编进固件，刷完即可使用。passwall=PassWall + SmartDNS（含 LuCI 管理页面）及现机依赖（默认）；passwall2、openclash、homeproxy、ssr-plus=其他客户端 + SmartDNS；none=不编入。不含 WireGuard。节点和订阅配置留在路由器上，不会进入公开镜像。"
        type: choice
        options: [passwall, passwall2, openclash, homeproxy, ssr-plus, none]
        default: passwall
      signature:
        description: "自定义版本签名，出现在 SSH 登录横幅和系统信息里，用来替换 Kwrt 自带的 by Kiddin'。留空则去掉作者签名，只显示 Ryan-OpenWrt 和版本号。"
        required: false
        default: ""
      remove_author_links:
        description: "是否去掉固件里的作者外链。默认 yes，会清除 LuCI 和横幅里指向 openwrt.ai 的主页链接。软件源地址 dl.openwrt.ai 会保留，不影响 opkg 装包。"
        type: choice
        options: [yes, no]
        default: yes
      extra_packages:
        description: "额外编进固件的软件包，空格分隔，可留空。包名写错会导致编译失败。科学上网请用上面的“互联网”选项，不要写在这里。"
        required: false
        default: ""
  schedule:
    # 每月 1 号 08:00 CST（00:00 UTC）
    - cron: "0 0 1 * *"
  push:
    branches: [main, master]
    paths:
      - "packages.txt"
      - "extra.config"
      - "build.conf"
      - "files/**"
      - "scripts/**"
      - ".github/workflows/build.yml"

concurrency:
  group: build-x86_64
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      TZ: Asia/Shanghai
      TARGET: x86_64

    steps:
      - name: Checkout overlay
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Install build deps
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget dwarves \
            llvm python3-pyelftools libpython3-dev aria2 jq qemu-utils ccache \
            libelf-dev device-tree-compiler libgmp3-dev libmpc-dev libfuse-dev rename
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          sudo timedatectl set-timezone "$TZ"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Prepare OpenWrt tree
        env:
          IN_LAN_IP: ${{ inputs.lan_ip }}
          IN_HOSTNAME: ${{ inputs.hostname }}
          IN_WEB_SERVER: ${{ inputs.web_server }}
          IN_WAN_PORT: ${{ inputs.wan_port }}
          IN_LAN_PORTS: ${{ inputs.lan_ports }}
          IN_WAN_PROTO: ${{ inputs.wan_proto }}
          IN_FILESYSTEM: ${{ inputs.filesystem }}
          IN_IPV6: ${{ inputs.ipv6 }}
          IN_INTERNET: ${{ inputs.internet }}
          IN_SIGNATURE: ${{ inputs.signature }}
          IN_REMOVE_AUTHOR_LINKS: ${{ inputs.remove_author_links }}
          IN_EXTRA_PACKAGES: ${{ inputs.extra_packages }}
        run: |
          chmod +x scripts/prepare.sh
          ./scripts/prepare.sh

      - name: Move build dirs to extra disk
        run: |
          sudo mkdir -p -m 777 /mnt/openwrt/build_dir
          rm -rf openwrt/build_dir
          ln -s /mnt/openwrt/build_dir openwrt/build_dir

      - name: Set Go build cache dir
        run: |
          # golang-package.mk 会 unexport GOCACHE，必须以 CONFIG_GOLANG_BUILD_CACHE_DIR 为准。
          # 写成绝对路径，避免 kconfig 把 $(TOPDIR) 存乱。
          # 放在工具链缓存和 stamp 刷新之前：tmp/.build 依赖 .config，之后再改 .config
          # 会让 tmp/.build 变新，tools/toolchain 的 stamp 又被判过期。
          mkdir -p openwrt/.ccache openwrt/.go-cache openwrt/dl
          abs="$GITHUB_WORKSPACE/openwrt/.go-cache"
          if grep -q '^CONFIG_GOLANG_BUILD_CACHE_DIR=' openwrt/.config 2>/dev/null; then
            sed -i 's|^CONFIG_GOLANG_BUILD_CACHE_DIR=.*|CONFIG_GOLANG_BUILD_CACHE_DIR="'"$abs"'"|' openwrt/.config
          else
            echo "CONFIG_GOLANG_BUILD_CACHE_DIR=\"$abs\"" >> openwrt/.config
          fi
          grep '^CONFIG_GOLANG_BUILD_CACHE_DIR=' openwrt/.config || true

      - name: Cache toolchain
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: |
            openwrt/staging_dir/host
            openwrt/staging_dir/hostpkg
            openwrt/staging_dir/toolchain-*
            openwrt/build_dir/host
            openwrt/build_dir/hostpkg
            openwrt/build_dir/toolchain-*
          key: x86_64-toolchain-v2-${{ hashFiles('openwrt/tools/**', 'openwrt/toolchain/**', 'extra.config') }}
          restore-keys: |
            x86_64-toolchain-v2-

      - name: Refresh toolchain stamps on exact cache hit
        if: steps.cache-toolchain.outputs.cache-hit == 'true'
        run: |
          # 精确命中说明 tools/toolchain 源与 extra.config 未变。
          # 刚 clone 的源码时间戳比缓存里的 stamp 新，make 会当成过期并重编。
          # 做法有据：OpenWrt 官方 CI 的 scripts/ext-tools.sh 靠刷新 stamp 跳过预编译工具的重编；
          # 主线 commit c459c71（PR #25626）改用 touch -r 临时文件，带上亚秒时间戳，
          # 且晚于源码检出，避免 timestamp.pl 的小数秒比较仍判定源码更新。
          # 社区常见写法（OpenWrt 论坛及多份 Actions 配置）还会 touch
          # staging_dir/{host,hostpkg,toolchain-*}/stamp 与 build_dir 下的 .built* / .prepared* / .configured*。
          # 只在 cache-hit==true 时做。restore-keys 部分命中可能源已变，交给 make 决定是否重编。
          set -euo pipefail
          cd openwrt
          ref=$(mktemp)
          # 某个目录不存在时 find 返回非零；pipefail 下不能让它把整步弄失败。
          { find staging_dir/host staging_dir/hostpkg staging_dir/toolchain-* \
               build_dir/host build_dir/hostpkg build_dir/toolchain-* \
            \( -path '*/stamp/*' -o -name '.built*' -o -name '.configured*' -o -name '.prepared*' \) \
            -type f -print0 2>/dev/null || true; } | xargs -0 -r touch -r "$ref"
          mkdir -p tmp
          touch -r "$ref" tmp/.build
          rm -f "$ref"
          echo "Refreshed tools/toolchain stamps (exact cache hit)"

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: openwrt/.ccache
          key: x86_64-ccache-v2
          restore-keys: |
            x86_64-ccache-v2
            x86_64-ccache-

      - name: Restore Go build cache
        uses: actions/cache/restore@v4
        with:
          path: openwrt/.go-cache
          key: x86_64-gocache-v2
          restore-keys: |
            x86_64-gocache-v2
            x86_64-gocache-

      - name: Restore dl cache
        id: cache-dl
        uses: actions/cache/restore@v4
        with:
          path: openwrt/dl
          # v3：v2 的 dl 缓存含 go-mod-cache，配合旧的小文件清理会还原出残缺的 Go 模块，弃用。
          key: x86_64-dl-v3-${{ hashFiles('packages.txt') }}
          restore-keys: |
            x86_64-dl-v3-

      - name: Download sources
        run: |
          mkdir -p openwrt/.ccache openwrt/.go-cache openwrt/dl
          cd openwrt
          # Go 模块缓存（GOMODCACHE=dl/go-mod-cache）随 dl 缓存保存。已解压的模块目录不会被
          # Go 重新校验，缺文件只会在编译时报错；这里删掉解压目录，只留 cache/download 里的
          # zip，编译时 Go 会按 go.sum 校验 zip 后重新解压，坏缓存无法混进来。
          if [ -d dl/go-mod-cache ]; then
            chmod -R u+w dl/go-mod-cache 2>/dev/null || true
            find dl/go-mod-cache -mindepth 1 -maxdepth 1 ! -name cache -exec rm -rf {} + || true
          fi
          make download -j8 || make download -j1 V=s
          # 只清理下载失败留下的小文件（<1 KiB）。必须跳过 go-mod-cache：里面有大量合法的小文件
          # （如 protobuf 的 editions_defaults.binpb 只有 154 字节），误删会导致 Go 包编译失败。
          find dl -path dl/go-mod-cache -prune -o -type f -size -1024c -print -exec rm -f {} + || true
          echo "==> cache dir sizes before compile:"
          du -sh .ccache .go-cache dl dl/go-mod-cache \
            staging_dir/host staging_dir/hostpkg staging_dir/toolchain-* \
            build_dir/host build_dir/hostpkg build_dir/toolchain-* 2>/dev/null || true
          # dl/ 只在体积可控时保存，避免挤占 10 GB 配额（优先保工具链和 ccache）
          dl_mb=$(du -sm dl | awk '{print $1}')
          if [ "$dl_mb" -le 1536 ]; then
            echo "SAVE_DL=true" >> "$GITHUB_ENV"
            echo "dl/ is ${dl_mb}MB, will save dl cache"
          else
            echo "SAVE_DL=false" >> "$GITHUB_ENV"
            echo "dl/ is ${dl_mb}MB, skip saving dl cache to protect 10GB quota"
          fi

      - name: Compile
        id: compile
        run: |
          df -hT
          cd openwrt
          # 路径必须是 .ccache，与 rules.mk 默认 CCACHE_DIR=$(TOPDIR)/.ccache 一致。
          # 不要在这里 export CCACHE_NOCOMPRESS / CCACHE_DIR / CCACHE_BASEDIR，交给 OpenWrt。
          # 不要设置 CCACHE_NOHASHDIR / CCACHE_HASHDIR（见上游 PR #20317）。
          ccache -d .ccache -M 8G
          ccache -d .ccache -o sloppiness=time_macros,include_file_mtime,include_file_ctime
          ccache -d .ccache -o compiler_check=content
          echo "==> ccache stats before compile"
          ccache -s -d .ccache || true
          make -j$(($(nproc)+1)) || {
            log=$(mktemp)
            make -j1 V=s >"$log" 2>&1 || true
            tail -n 80 "$log"
            exit 1
          }
          echo "==> ccache stats after compile"
          ccache -s -d .ccache || true
          df -hT

      - name: Delete previous fixed cache keys
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          # 固定键已存在时 actions/cache/save 会拒绝写入。此处只删即将覆盖的固定键，
          # 以及本前缀下明显过期的 run_id 旧条目。失败不让整次编译失败。
          set +e
          gh cache delete x86_64-ccache-v2 || true
          gh cache delete x86_64-gocache-v2 || true
          # 清掉改为固定键之前、按 run_id 堆积的旧 ccache（保留前缀匹配到的最新 1 个以防万一）
          prune_old() {
            prefix="$1"
            keep="$2"
            mapfile -t rows < <(gh cache list --key "$prefix" --sort last_accessed_at --order desc --limit 100 --json id,key --jq '.[] | "\(.id)\t\(.key)"')
            echo "Caches with prefix $prefix:"
            printf '%s\n' "${rows[@]}"
            idx=0
            for row in "${rows[@]}"; do
              id="${row%%$'\t'*}"
              key="${row#*$'\t'}"
              idx=$((idx + 1))
              if [ "$idx" -le "$keep" ]; then
                echo "keep $key ($id)"
                continue
              fi
              echo "delete $key ($id)"
              gh cache delete "$id" || true
            done
          }
          # 固定键刚删掉，这里 keep=0 会清掉其余 x86_64-ccache-* / x86_64-gocache-* 旧条目
          prune_old "x86_64-ccache-" 0
          prune_old "x86_64-gocache-" 0
          # 工具链只保留最近 2 个 v2（通常只有当前哈希）
          prune_old "x86_64-toolchain-v2-" 2
          # dl 已升到 v3，v2 的条目（含残缺风险的 go-mod-cache）不再使用，全部清掉
          prune_old "x86_64-dl-v2-" 0
          # 旧的、键里带 packages.txt 哈希的工具链缓存可以清掉
          # 注意：不要用前缀 x86_64-toolchain-（会连 v2 一起匹配）。逐条判断。
          mapfile -t tcs < <(gh cache list --key "x86_64-toolchain-" --limit 100 --json id,key --jq '.[] | "\(.id)\t\(.key)"')
          for row in "${tcs[@]}"; do
            id="${row%%$'\t'*}"
            key="${row#*$'\t'}"
            case "$key" in
              x86_64-toolchain-v2-*) echo "keep toolchain v2 $key" ;;
              *) echo "delete old toolchain key $key ($id)"; gh cache delete "$id" || true ;;
            esac
          done
          gh cache list --limit 50 || true
          true

      - name: Save ccache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: openwrt/.ccache
          key: x86_64-ccache-v2

      - name: Save Go build cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: openwrt/.go-cache
          key: x86_64-gocache-v2

      - name: Save dl cache
        if: success() && env.SAVE_DL == 'true' && steps.cache-dl.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: openwrt/dl
          key: x86_64-dl-v3-${{ hashFiles('packages.txt') }}

      - name: Collect artifacts
        run: |
          mkdir -p out
          shopt -s nullglob
          # shellcheck disable=SC1091
          . openwrt/files/etc/ryan-build.conf
          if [ "$FILESYSTEM" = squashfs ]; then
            imgpat='*squashfs-combined-efi.img.gz'
          else
            imgpat='*ext4-combined-efi.img.gz'
          fi
          cp openwrt/bin/targets/x86/64/$imgpat out/ || true
          cp openwrt/bin/targets/x86/64/sha256sums out/ || true
          cp openwrt/.config out/config.build || true
          cp openwrt/files/etc/ryan-build.conf out/ryan-build.conf || true
          {
            echo "BUILD_OPTS<<EOF"
            sed 's/^/- /' openwrt/files/etc/ryan-build.conf
            echo "EOF"
            echo "IMAGE_PAT=$imgpat"
          } >> "$GITHUB_ENV"
          ls -lh out
          test -n "$(ls -A out/$imgpat 2>/dev/null)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ryan-openwrt-x86_64
          path: out/
          if-no-files-found: error
          retention-days: 14

      - name: Stamp version
        run: echo "STAMP=$(TZ=Asia/Shanghai date +%Y.%m.%d)-${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.STAMP }}-x86_64
          name: Ryan-OpenWrt ${{ env.STAMP }} x86_64
          files: out/*
          body: |
            基于 kiddin9/Kwrt `25.12` + OpenWrt `openwrt-25.12`。
            刷机文件：按本次选项生成的 `*-combined-efi.img.gz`（EFI，文件系统见下面的 FILESYSTEM）。

            编译选项：
            ${{ env.BUILD_OPTS }}

            - SSH: 端口见现机配置，公网由防火墙挡住
            - 包清单：`packages.txt`
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
